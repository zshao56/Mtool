# ═══════════════════════════════════════════════════════════════════════════
#  THE NAME LIVES HERE AND NOWHERE ELSE.
#
#  Renaming the app is: edit the values in this block, rename the GitHub repo,
#  swap the icon in Assets.xcassets, and fix the README. No Swift file contains
#  the product name; everything downstream reads it back from the built bundle
#  (see Sources/Core/Brand.swift).
#
#  Mtool is a GPL-3.0 derivative of QDuo by XueshiQiao
#  (https://github.com/XueshiQiao/qduo). The original copyright notice and the
#  GPL license are retained (see LICENSE and README.md).
# ═══════════════════════════════════════════════════════════════════════════
name: &APP_NAME Mtool

.brand:
  # The reverse-DNS id WITHOUT a configuration suffix. Keychain items and the
  # support directory hang off this, so Debug and Release share them.
  baseID: &BASE_ID io.github.zshao56.mtool
  # What the Release build ships as. Debug appends ".debug" below so both can
  # be installed at once.
  bundleID: &BUNDLE_ID io.github.zshao56.mtool
  repoURL: &REPO_URL https://github.com/zshao56/Mtool

options:
  bundleIdPrefix: io.github.zshao56
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

schemes:
  Mtool:
    build:
      targets:
        Mtool: all
    test:
      targets:
        - MtoolTests

targets:
  Mtool:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
      - Resources
    settings:
      base:
        PRODUCT_NAME: *APP_NAME
        PRODUCT_BUNDLE_IDENTIFIER: *BUNDLE_ID
        # Read back at runtime through Info.plist so Swift never spells any of
        # this out. See Sources/Core/Brand.swift.
        BRAND_BASE_ID: *BASE_ID
        BRAND_REPO_URL: *REPO_URL

        INFOPLIST_FILE: Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Supporting/App.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        # No upstream Developer ID here. Local builds and CI get an ad-hoc
        # signature unless the environment provides its own identity; the
        # release workflow signs with "Developer ID Application" only when the
        # user supplies their OWN certificate secrets. See docs/RELEASING.md.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.zshao56.mtool.debug
          PRODUCT_NAME: Mtool-Debug
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      # macOS 15+ only, and the app runs on 13: weak, or dyld refuses to launch
      # it on 13/14. `_Translation_SwiftUI` is the overlay `.translationTask`
      # lives in, linked implicitly by Swift, so it is weakened the same way.
      - sdk: Translation.framework
        weak: true
      - sdk: _Translation_SwiftUI.framework
        weak: true

  # Unit tests for the parts that are pure calculation. Deliberately NOT hosted
  # in the app: Mtool installs global input monitors at launch, so a test host
  # would wake all of that (and its Accessibility prompts) on every run. The
  # files under test compile straight into the bundle instead.
  MtoolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/PopBar/Window/WheelSubmenu.swift
      - path: Sources/PopBar/Selection/SelectionText.swift
      - path: Sources/Core/Config/JSONValue.swift
      - path: Sources/Core/Brand.swift
      - path: Sources/PopBar/Actions/PopBarActionConfig.swift
      - path: Sources/PopBar/Actions/TextTransform.swift
      - path: Sources/PopBar/Actions/TextDiff.swift
      - path: Sources/UI/Onboarding/OnboardingProgress.swift
      - path: Sources/PopBar/Selection/OwnWindowHit.swift
      - path: Sources/Core/Speech/TTSEngine.swift
      - path: Sources/Core/Speech/TTSTransport.swift
      - path: Sources/Core/Speech/MarkAligner.swift
      - path: Sources/Core/Speech/TTSRunRecorder.swift
      - path: Sources/PopBar/Selection/SelectionIgnoreRules.swift
      - path: Sources/Core/FileLog.swift
      - path: Sources/Core/Config/ConfigSchema.swift
      - path: Sources/Core/History/HistoryRecord.swift
      - path: Sources/Core/History/HistoryStore.swift
      # Mtool additions
      - path: Sources/Core/Context/ContextSnapshot.swift
      - path: Sources/Core/Context/ModifierDoubleTapDetector.swift
      - path: Sources/Core/Context/TextInsertion.swift
      - path: Sources/Core/Clipboard/ClipboardItem.swift
      - path: Sources/Core/Clipboard/ClipboardPolicy.swift
      - path: Sources/Core/Clipboard/ClipboardStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zshao56.mtool.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
